[project]
name = "enterprise-ai-agent-platform"
version = "0.1.0"
description = "Enterprise AI agent platform built with FastAPI, LangGraph, modular tools, and multiple LLM providers."
requires-python = ">=3.11"



dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",


    # Settings / validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",


    # LangGraph + LangChain
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",


    # LLM providers
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langchain-google-genai",


    # Frontend / HTTP
    "streamlit>=1.37.0",
    "requests>=2.32.0",

    # Environment variables
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]